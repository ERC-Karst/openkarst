site_name: openKARST manual
site_description: Professional user manual for openKARST flow simulations.
site_url: https://erc-karst.github.io/openkarst/
repo_url: https://github.com/ERC-Karst/openkarst
repo_name: ERC-Karst/openkarst

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - Concepts:
      - Overview: concepts/overview.md
      - Networks and geometry: concepts/networks.md
      - Simulation workflow: concepts/simulation-workflow.md
      - Results and observations: concepts/results.md
  - Tutorials:
      - 1. Minimal straight conduit: tutorials/minimal-straight-conduit.md
      - 2. Boundary conditions: tutorials/boundary-conditions.md
      - 3. Observations and results: tutorials/observations-and-results.md
      - 4. Cave network import: tutorials/cave-network.md
      - 5. Analytical validation: tutorials/analytical-validation.md
  - How-to guides:
      - Use the 3D viewer: how-to/visualize-viewer.md
      - Export to VTK: how-to/export-vtk.md
      - Choose performance settings: how-to/performance.md
  - Reference:
      - Parameters: reference/parameters.md
      - Glossary: reference/glossary.md
  - Contributing: contributing.md
  - Citation: citation.md

theme:
  name: material
  language: en
  logo: assets/images/openkarst_header_white.png
  favicon: assets/images/openkarst_favicon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  version: "0.4.0"
